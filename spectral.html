<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectral Reflectance Editor</title>
<style>
  :root {
    --bg: #2b2b2b;
    --panel: #383838;
    --panel-border: #4a4a4a;
    --plot-bg: #1a1a1a;
    --text: #f0f0f0;
    --muted: #a8a8a8;
    --btn: #4a4a4a;
    --btn-hover: #5a5a5a;
    --accent: #2f6bff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  }
  h1 { font-size: 15px; text-align: center; margin: 4px 0 18px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .app { display: grid; grid-template-columns: minmax(280px, 390px) 1fr; gap: 20px; max-width: 1100px; margin: 0 auto; }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px; padding: 24px; }
  .swatch { height: 150px; border-radius: 10px; border: 6px solid #181818; box-shadow: 0 4px 14px rgba(0,0,0,.5); transition: background .05s; }
  .readout { margin: 10px 2px 0; font: 12px/1.5 ui-monospace, Consolas, monospace; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; }
  label { display: block; margin: 18px 0 6px; font-weight: 700; font-size: 14px; color: #c8c8c8; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  hr { border: 0; border-top: 1px solid var(--panel-border); margin: 22px 0; }
  h2 { font-size: 17px; text-align: center; margin: 0 0 14px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button {
    background: var(--btn); color: var(--text); border: 0; border-radius: 4px;
    padding: 10px 6px; font: 700 13px inherit; font-family: inherit; cursor: pointer;
  }
  button:hover { background: var(--btn-hover); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .plot-title { text-align: center; font-size: 18px; font-weight: 700; margin: 0 0 18px; }
  .plot-wrap { background: var(--plot-bg); border-radius: 10px; padding: 12px; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; touch-action: none; cursor: crosshair; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; justify-content: center; }
  .tools button { padding: 8px 14px; }
  .hint { text-align: center; color: #777; font-size: 12px; margin: 14px 8px 0; }
  .check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>Spectral Reflectance Editor</h1>
<div class="app">
  <section class="panel" aria-label="Colore">
    <div class="swatch" id="swatch"></div>
    <div class="readout"><span id="hex">#------</span><span id="xyz">XYZ</span></div>

    <label for="sL">L* (Lightness): <span id="vL"></span></label>
    <input type="range" id="sL" min="0" max="100" step="1" value="50">
    <label for="sa">a* (Green-Red): <span id="va"></span></label>
    <input type="range" id="sa" min="-100" max="100" step="1" value="0">
    <label for="sb">b* (Blue-Yellow): <span id="vb"></span></label>
    <input type="range" id="sb" min="-100" max="100" step="1" value="0">

    <hr>
    <h2>Material Presets</h2>
    <div class="btns" id="presets"></div>
  </section>

  <section class="panel" aria-label="Spettro">
    <h2 class="plot-title">Spectral Reflectance (400nm - 700nm)</h2>
    <div class="plot-wrap"><canvas id="plot" width="960" height="600"></canvas></div>
    <div class="tools">
      <button id="undo">Undo</button>
      <button id="smooth">Smooth</button>
      <button id="reset">Reset 50%</button>
      <button id="csv">Export CSV</button>
      <label class="check"><input type="checkbox" id="snap"> Snap 5%</label>
    </div>
    <p class="hint">Draw with the mouse (or finger) to modify the curve. Note: blues near 400nm often appear slightly violet due to sRGB limitations.</p>
  </section>
</div>

<script>
(() => {
  'use strict';
  // ---------- Colorimetry (CIE 1931 2°, D65, 400–700 nm @ 10 nm) ----------
  const N = 31, WL = Array.from({length: N}, (_, i) => 400 + i * 10);
  const D65 = [82.75,91.49,93.43,86.68,104.86,117.01,117.81,114.86,115.92,108.81,109.35,107.80,104.79,107.69,104.41,104.05,100.00,96.33,95.79,88.69,90.01,89.60,87.70,83.29,83.70,80.03,80.21,82.28,78.28,69.72,71.61];
  const g = (l, m, s1, s2) => { const t = (l - m) / (l < m ? s1 : s2); return Math.exp(-0.5 * t * t); };
  // Wyman, Sloan & Shirley (2013) multi-lobe fit of the CIE 1931 CMFs
  const xb = l => 1.056 * g(l,599.8,37.9,31.0) + 0.362 * g(l,442.0,16.0,26.7) - 0.065 * g(l,501.1,20.4,26.2);
  const yb = l => 0.821 * g(l,568.8,46.9,40.5) + 0.286 * g(l,530.9,16.3,31.1);
  const zb = l => 1.217 * g(l,437.0,11.8,36.0) + 0.681 * g(l,459.0,26.0,13.8);
  const W = WL.map((l, i) => [xb(l) * D65[i], yb(l) * D65[i], zb(l) * D65[i]]);
  const k = 100 / W.reduce((s, w) => s + w[1], 0);
  const WHITE = W.reduce((s, w) => [s[0] + w[0] * k, s[1] + w[1] * k, s[2] + w[2] * k], [0, 0, 0]);

  const toXYZ = R => R.reduce((s, r, i) => [s[0] + r * W[i][0] * k, s[1] + r * W[i][1] * k, s[2] + r * W[i][2] * k], [0, 0, 0]);
  const f = t => t > 216/24389 ? Math.cbrt(t) : (24389/27 * t + 16) / 116;
  const fi = t => t ** 3 > 216/24389 ? t ** 3 : (116 * t - 16) / (24389/27);
  const xyzToLab = ([X, Y, Z]) => {
    const fx = f(X / WHITE[0]), fy = f(Y / WHITE[1]), fz = f(Z / WHITE[2]);
    return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
  };
  const toLab = R => xyzToLab(toXYZ(R));
  const gam = c => { c = Math.min(1, Math.max(0, c)); return c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1/2.4) - 0.055; };
  const xyzToRGB = ([X, Y, Z]) => {
    X /= 100; Y /= 100; Z /= 100;
    return [3.2406*X - 1.5372*Y - 0.4986*Z, -0.9689*X + 1.8758*Y + 0.0415*Z, 0.0557*X - 0.2040*Y + 1.0570*Z].map(c => Math.round(gam(c) * 255));
  };
  const hex = rgb => '#' + rgb.map(v => v.toString(16).padStart(2, '0')).join('');

  // ---------- State ----------
  const clamp01 = v => Math.min(1, Math.max(0, v));
  let R = new Array(N).fill(0.5);
  const history = [];
  const pushHistory = () => { history.push(R.slice()); if (history.length > 50) history.shift(); };

  // ---------- Lab -> spectrum (Gauss-Newton on a smooth cosine basis) ----------
  const BASIS = 6;
  const fromCoeffs = c => WL.map((_, i) => {
    const t = i / (N - 1);
    let v = c[0];
    for (let j = 1; j < BASIS; j++) v += c[j] * Math.cos(Math.PI * j * t);
    return clamp01(v);
  });
  function solveLinear(A, b) { // Gaussian elimination, small systems
    const n = b.length, M = A.map((r, i) => [...r, b[i]]);
    for (let i = 0; i < n; i++) {
      let p = i; for (let r = i + 1; r < n; r++) if (Math.abs(M[r][i]) > Math.abs(M[p][i])) p = r;
      [M[i], M[p]] = [M[p], M[i]];
      for (let r = i + 1; r < n; r++) { const m = M[r][i] / (M[i][i] || 1e-12); for (let c = i; c <= n; c++) M[r][c] -= m * M[i][c]; }
    }
    const x = new Array(n).fill(0);
    for (let i = n - 1; i >= 0; i--) { let s = M[i][n]; for (let c = i + 1; c < n; c++) s -= M[i][c] * x[c]; x[i] = s / (M[i][i] || 1e-12); }
    return x;
  }
  function labToSpectrum(target) {
    const Yt = fi((target[0] + 16) / 116);
    const c = new Array(BASIS).fill(0); c[0] = Yt;
    const lam = 0.05; // Levenberg-Marquardt damping keeps the solution smooth/stable
    for (let it = 0; it < 40; it++) {
      const lab0 = toLab(fromCoeffs(c));
      const err = target.map((t, i) => t - lab0[i]);
      if (Math.hypot(...err) < 0.05) break;
      const J = [[], [], []]; // J[row Lab][col coeff]
      for (let j = 0; j < BASIS; j++) {
        const cc = c.slice(); cc[j] += 0.01;
        const lab1 = toLab(fromCoeffs(cc));
        for (let r = 0; r < 3; r++) J[r][j] = (lab1[r] - lab0[r]) / 0.01;
      }
      const A = Array.from({length: BASIS}, (_, a) => Array.from({length: BASIS}, (_, b) => J[0][a]*J[0][b] + J[1][a]*J[1][b] + J[2][a]*J[2][b] + (a === b ? lam * (1 + a * a) : 0)));
      const rhs = Array.from({length: BASIS}, (_, a) => J[0][a]*err[0] + J[1][a]*err[1] + J[2][a]*err[2]);
      const d = solveLinear(A, rhs);
      for (let j = 0; j < BASIS; j++) c[j] += d[j] * 0.8;
    }
    return fromCoeffs(c);
  }

  // ---------- Presets ----------
  const sig = (l, c, w) => 1 / (1 + Math.exp(-(l - c) / w));
  const gauss = (l, c, w) => Math.exp(-0.5 * ((l - c) / w) ** 2);
  const PRESETS = {
    'Red Paint':  l => 0.04 + 0.84 * sig(l, 600, 12),
    'Leaf Green': l => 0.05 + 0.12 * gauss(l, 545, 28) + 0.45 * sig(l, 715, 14),
    'Cobalt Blue': l => 0.06 + 0.55 * gauss(l, 455, 32) + 0.12 * sig(l, 690, 10),
    '50% Grey':   () => 0.5,
  };

  // ---------- UI refs ----------
  const $ = id => document.getElementById(id);
  const sL = $('sL'), sa = $('sa'), sb = $('sb');
  const cv = $('plot'), ctx = cv.getContext('2d');
  const PAD = {l: 46, r: 14, t: 14, b: 50};
  const pw = () => cv.width - PAD.l - PAD.r, ph = () => cv.height - PAD.t - PAD.b;
  const xOf = i => PAD.l + i / (N - 1) * pw();
  const yOf = v => PAD.t + (1 - v) * ph();
  const fmt = v => v.toFixed(1).replace('.', ',');

  // Draw a visible-spectrum colour strip along the x-axis
  const stripRGB = WL.map(l => { const w = l; // simple monochromatic approx via CMFs
    return xyzToRGB([xb(w) * 100 * 0.9, yb(w) * 100 * 0.9, zb(w) * 100 * 0.9]); });

  function draw(hover) {
    const w = cv.width, h = cv.height;
    ctx.clearRect(0, 0, w, h);
    ctx.font = '15px "Segoe UI", sans-serif';
    ctx.textBaseline = 'middle';
    // grid + y labels
    ctx.lineWidth = 1;
    for (let v = 0; v <= 10; v++) {
      const y = Math.round(yOf(v / 10)) + .5;
      ctx.strokeStyle = '#3c3c3c'; ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(w - PAD.r, y); ctx.stroke();
      ctx.fillStyle = '#8a8a8a'; ctx.textAlign = 'right'; ctx.fillText(fmt(v / 10), PAD.l - 8, y);
    }
    ctx.textAlign = 'center';
    for (let i = 0; i < N; i++) {
      const x = Math.round(xOf(i)) + .5;
      ctx.strokeStyle = '#3c3c3c'; ctx.beginPath(); ctx.moveTo(x, PAD.t); ctx.lineTo(x, PAD.t + ph()); ctx.stroke();
      if (i % 2 === 0) {
        ctx.save(); ctx.translate(x, PAD.t + ph() + 10); ctx.rotate(-Math.PI / 4);
        ctx.textAlign = 'right'; ctx.fillStyle = '#8a8a8a'; ctx.fillText(WL[i], 0, 0); ctx.restore();
      }
    }
    // spectrum colour strip under the plot
    for (let i = 0; i < N; i++) {
      const x0 = i === 0 ? xOf(0) : (xOf(i) + xOf(i - 1)) / 2, x1 = i === N - 1 ? xOf(i) : (xOf(i) + xOf(i + 1)) / 2;
      ctx.fillStyle = `rgb(${stripRGB[i].join(',')})`; ctx.fillRect(x0, h - 8, x1 - x0 + 1, 4);
    }
    // filled area
    ctx.beginPath(); ctx.moveTo(xOf(0), yOf(0));
    R.forEach((v, i) => ctx.lineTo(xOf(i), yOf(v)));
    ctx.lineTo(xOf(N - 1), yOf(0)); ctx.closePath();
    ctx.fillStyle = 'rgba(47,107,255,.14)'; ctx.fill();
    // curve
    ctx.beginPath(); R.forEach((v, i) => i ? ctx.lineTo(xOf(i), yOf(v)) : ctx.moveTo(xOf(i), yOf(v)));
    ctx.strokeStyle = '#2f6bff'; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.stroke();
    // points
    R.forEach((v, i) => {
      ctx.beginPath(); ctx.arc(xOf(i), yOf(v), i === hover ? 6 : 4.5, 0, 7);
      ctx.fillStyle = i === hover ? '#fff' : '#1a1a1a'; ctx.fill();
      ctx.strokeStyle = '#2f6bff'; ctx.lineWidth = 2; ctx.stroke();
    });
    // tooltip
    if (hover != null && hover >= 0) {
      const t = `${WL[hover]} nm · ${R[hover].toFixed(3).replace('.', ',')}`;
      ctx.font = '600 15px "Segoe UI", sans-serif';
      const tw = ctx.measureText(t).width + 16;
      let tx = Math.min(w - PAD.r - tw, Math.max(PAD.l, xOf(hover) - tw / 2));
      let ty = yOf(R[hover]) - 36; if (ty < PAD.t) ty = yOf(R[hover]) + 14;
      ctx.fillStyle = 'rgba(20,20,20,.92)'; ctx.strokeStyle = '#555'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.roundRect(tx, ty, tw, 24, 5); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.fillText(t, tx + 8, ty + 12.5);
    }
  }

  let syncingSliders = false;
  function updateColor(fromSliders) {
    const xyz = toXYZ(R), lab = xyzToLab(xyz), rgb = xyzToRGB(xyz);
    $('swatch').style.background = hex(rgb);
    $('hex').textContent = hex(rgb).toUpperCase();
    $('xyz').textContent = `XYZ ${xyz.map(v => v.toFixed(1)).join(' ')}`;
    if (!fromSliders) {
      syncingSliders = true;
      sL.value = lab[0]; sa.value = lab[1]; sb.value = lab[2];
      syncingSliders = false;
    }
    $('vL').textContent = Math.round(lab[0]);
    $('va').textContent = Math.round(lab[1]);
    $('vb').textContent = Math.round(lab[2]);
  }
  const refresh = (fromSliders, hover) => { draw(hover); updateColor(fromSliders); };

  // ---------- Drawing with pointer ----------
  let drawing = false, last = null, hoverIdx = -1;
  function pos(e) {
    const r = cv.getBoundingClientRect();
    const px = (e.clientX - r.left) * cv.width / r.width, py = (e.clientY - r.top) * cv.height / r.height;
    let v = clamp01(1 - (py - PAD.t) / ph());
    if ($('snap').checked) v = Math.round(v * 20) / 20;
    return {x: Math.min(N - 1, Math.max(0, (px - PAD.l) / pw() * (N - 1))), v};
  }
  function paint(a, b) { // fill every bin between two samples so fast strokes leave no gaps
    const i0 = Math.round(Math.min(a.x, b.x)), i1 = Math.round(Math.max(a.x, b.x));
    for (let i = i0; i <= i1; i++) {
      const t = b.x === a.x ? 1 : (i - a.x) / (b.x - a.x);
      R[i] = a.x === b.x ? b.v : clamp01(a.v + (b.v - a.v) * Math.min(1, Math.max(0, t)));
    }
  }
  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId); pushHistory(); drawing = true;
    last = pos(e); paint(last, last); hoverIdx = Math.round(last.x); refresh(false, hoverIdx);
  });
  cv.addEventListener('pointermove', e => {
    const p = pos(e); hoverIdx = Math.round(p.x);
    if (drawing) { paint(last, p); last = p; refresh(false, hoverIdx); } else draw(hoverIdx);
  });
  const stop = () => { drawing = false; };
  cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop);
  cv.addEventListener('pointerleave', () => { if (!drawing) { hoverIdx = -1; draw(); } });

  // ---------- Controls ----------
  const setSpectrum = arr => { pushHistory(); R = arr.map(clamp01); refresh(false); };
  const onLab = () => {
    if (syncingSliders) return;
    $('vL').textContent = sL.value; $('va').textContent = sa.value; $('vb').textContent = sb.value;
    R = labToSpectrum([+sL.value, +sa.value, +sb.value]);
    refresh(true);
  };
  [sL, sa, sb].forEach(s => { s.addEventListener('pointerdown', pushHistory); s.addEventListener('input', onLab); });

  Object.entries(PRESETS).forEach(([name, fn]) => {
    const b = document.createElement('button'); b.textContent = name;
    b.onclick = () => setSpectrum(WL.map(fn));
    $('presets').appendChild(b);
  });
  $('undo').onclick = () => { if (history.length) { R = history.pop(); refresh(false); } };
  $('reset').onclick = () => setSpectrum(new Array(N).fill(0.5));
  $('smooth').onclick = () => setSpectrum(R.map((v, i) => (R[Math.max(0, i - 1)] + 2 * v + R[Math.min(N - 1, i + 1)]) / 4));
  $('csv').onclick = () => {
    const csv = 'wavelength_nm,reflectance\n' + WL.map((l, i) => `${l},${R[i].toFixed(4)}`).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'})); a.download = 'spectrum.csv'; a.click();
    URL.revokeObjectURL(a.href);
  };
  window.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); $('undo').click(); } });

  // Start from the colour shown in the reference (L*76 a*7 b*5)
  sL.value = 76; sa.value = 7; sb.value = 5;
  onLab();
})();
</script>
</body>
</html>
