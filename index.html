<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tempo Reale — l'omino che disegna i minuti</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕰️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 75% 80% at 50% 46%, rgba(0,0,0,0) 58%, rgba(0,0,0,.42) 100%);
  }
  #hud {
    position: fixed; left: calc(18px + env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    font-family: "Fraunces", Georgia, "Times New Roman", serif; font-weight: 300;
    color: #f4ecdc; text-shadow: 0 1px 8px rgba(0,0,0,.55);
    transition: opacity .8s ease; pointer-events: none; line-height: 1.25;
  }
  #hud.hidden { opacity: 0; }
  #hud .temp { font-size: 34px; letter-spacing: -.01em; }
  #hud .cond { font-size: 16px; font-style: italic; opacity: .92; }
  #hud .meta { font-size: 12.5px; opacity: .7; margin-top: 2px; }
  #help {
    position: fixed; right: 18px; bottom: 14px; max-width: 280px;
    font: 300 13px/1.5 "Fraunces", Georgia, serif; color: #f4ecdc;
    background: rgba(12,14,20,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(244,236,220,.18); border-radius: 10px; padding: 12px 14px;
    opacity: 0; transition: opacity .4s ease; pointer-events: none;
  }
  #help.show { opacity: 1; }
  #sound {
    position: fixed; right: calc(18px + env(safe-area-inset-right, 0px)); top: calc(14px + env(safe-area-inset-top, 0px));
    width: 42px; height: 42px; border-radius: 50%; cursor: pointer; padding: 0;
    display: grid; place-items: center; color: #f4ecdc;
    background: rgba(12,14,20,.4); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(244,236,220,.22); transition: opacity .8s ease, background .3s ease;
  }
  #sound:hover { background: rgba(12,14,20,.6); }
  #sound:focus-visible { outline: 2px solid #f4ecdc; outline-offset: 3px; }
  #sound .on { display: none; }
  #sound[aria-pressed="true"] .on { display: block; }
  #sound[aria-pressed="true"] .off { display: none; }
  #sound.hidden { opacity: 0; pointer-events: none; }
  #help b { font-weight: 300; font-style: italic; }
  @media (prefers-reduced-motion: reduce) { #hud, #help { transition: none; } }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="hud">
  <div class="temp" id="wTemp">--°</div>
  <div class="cond" id="wCond">Sto leggendo il meteo…</div>
  <div class="meta" id="wMeta"></div>
  <div class="meta" id="wSky"></div>
</div>
<button id="sound" type="button" aria-pressed="false" aria-label="Attiva i suoni" title="Suoni (S)">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
    <g class="on"><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></g>
    <g class="off"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g>
  </svg>
</button>
<div id="help">
  <b>Tasti</b><br>
  1 sereno, 2 nuvoloso, 3 pioggia, 4 temporale, 5 neve, 6 nebbia, 0 meteo reale<br>
  T cambia stagione, G giornata accelerata, B pausa dell'omino<br>
  S suoni, P effetti cinema, H mostra o nasconde il meteo, ? questo aiuto
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- post-processing (bloom + profondità di campo). Se non si caricano, la pagina funziona lo stesso -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/BokehShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/BokehPass.js"></script>
<script>
"use strict";
/* =====================================================================
   CONFIGURAZIONE  (tutto modificabile anche da URL, es. ?lat=45.6&lon=9.37&hud=0&q=low)
   ===================================================================== */
const P = new URLSearchParams(location.search);
const num = (k, d) => { const v = parseFloat(P.get(k)); return Number.isFinite(v) ? v : d; };
const CONFIG = {
  lat: num('lat', 45.6127),          // Vimercate (MB) — cambia qui o via ?lat=&lon=
  lon: num('lon', 9.3686),
  useGeolocation: P.get('geo') === '1', // ?geo=1 per usare la posizione del browser
  weatherRefreshMin: 10,
  quality: P.get('q') === 'low' ? 'low' : 'high',
  showHud: P.get('hud') !== '0',
  forcedWeather: P.get('meteo'),      // sereno | nuvoloso | pioggia | temporale | neve | nebbia
  daySpeed: num('speed', 1),          // >1 accelera solo il ciclo del giorno (es. 720)
  fx: P.get('fx') !== '0',            // bloom + profondità di campo (solo qualità alta)
  sound: P.get('audio') === '1',      // ?audio=1 per partire con i suoni (serve un tocco, o Chromium in kiosk)
  season: P.get('stagione')           // inverno | primavera | estate | autunno (altrimenti dalla data)
};
const LOW = CONFIG.quality === 'low';
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ===================== utilità ===================== */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(73021);
function hash(x, y){ const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y){ let s = 0, a = .5, f = 1; for (let i = 0; i < 4; i++){ s += a * vnoise(x * f, y * f); f *= 2; a *= .5; } return s; }
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const col = h => new THREE.Color(h);

/* ===================== renderer / scena ===================== */
const renderer = new THREE.WebGLRenderer({ antialias: !LOW, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, LOW ? 1 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x9fb4c8, 0.0022);
const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.05, 1500);
const CAM_BASE = V3(0, 1.85, 5.4), CAM_LOOK = V3(0, 1.68, 0);
camera.position.copy(CAM_BASE);

/* ===================== texture procedurali ===================== */
function canvasTex(c, srgb = true){ const t = new THREE.CanvasTexture(c); if (srgb) t.encoding = THREE.sRGBEncoding; t.anisotropy = MAX_ANISO; return t; }
function makeWood(){
  const c = document.createElement('canvas'); c.width = 512; c.height = 1024; const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 512, 0);
  grd.addColorStop(0, '#5e351c'); grd.addColorStop(.5, '#6e4124'); grd.addColorStop(1, '#5a321b');
  g.fillStyle = grd; g.fillRect(0, 0, 512, 1024);
  for (let i = 0; i < 260; i++){
    const x = rand() * 512, dark = rand() < .62;
    g.strokeStyle = dark ? `rgba(38,18,7,${.06 + rand() * .2})` : `rgba(175,115,62,${.04 + rand() * .12})`;
    g.lineWidth = .5 + rand() * 2.6; g.beginPath();
    for (let y = 0; y <= 1024; y += 12){
      const xx = x + Math.sin(y * .005 + i) * 7 + Math.sin(y * .021 + i * 3) * 2.2;
      y === 0 ? g.moveTo(xx, y) : g.lineTo(xx, y);
    }
    g.stroke();
  }
  for (let k = 0; k < 3; k++){
    const kx = 60 + rand() * 390, ky = 100 + rand() * 820;
    for (let r = 4; r < 46; r += 3){
      g.strokeStyle = `rgba(35,16,6,${.18 - r * .003})`; g.lineWidth = 1.2;
      g.beginPath(); g.ellipse(kx, ky, r * .55, r * 1.6, 0, 0, Math.PI * 2); g.stroke();
    }
  }
  const t = canvasTex(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
function makeStone(){
  const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d');
  g.fillStyle = '#3e3a36'; g.fillRect(0, 0, 1024, 1024);
  const S = 64;
  for (let y = 0; y < 1024; y += S) for (let x = 0; x < 1024; x += S){
    const off = ((y / S) % 2) * S * .5, v = 118 + rand() * 40 | 0;
    g.fillStyle = `rgb(${v + 6},${v},${v - 10})`;
    const w = S - 6 - rand() * 4, h = S - 6 - rand() * 4;
    g.beginPath();
    if (g.roundRect) g.roundRect(x + off + 3, y + 3, w, h, 10); else g.rect(x + off + 3, y + 3, w, h);
    g.fill();
    for (let n = 0; n < 14; n++){ g.fillStyle = `rgba(${rand() < .5 ? '0,0,0' : '255,255,255'},${rand() * .06})`; g.fillRect(x + off + rand() * S, y + rand() * S, 3 + rand() * 7, 2 + rand() * 5); }
  }
  return canvasTex(c);
}
function makeDot(){
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.35, 'rgba(255,255,255,.55)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64); return canvasTex(c);
}
function makeCloud(){
  const c = document.createElement('canvas'); c.width = 512; c.height = 256; const g = c.getContext('2d');
  for (let i = 0; i < 26; i++){
    const x = 105 + rand() * 300, y = 150 + (rand() - .5) * 30 - Math.sin((x - 105) / 300 * Math.PI) * 25, rr = 35 + rand() * 38;
    const r = g.createRadialGradient(x, y, 0, x, y, rr);
    r.addColorStop(0, 'rgba(255,255,255,.55)'); r.addColorStop(.6, 'rgba(255,255,255,.22)'); r.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = r; g.beginPath(); g.arc(x, y, rr, 0, Math.PI * 2); g.fill();
  }
  return canvasTex(c);
}
function makeMoon(){
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#e9e6dc'; g.beginPath(); g.arc(128, 128, 126, 0, Math.PI * 2); g.fill();
  for (let i = 0; i < 26; i++){
    const a = rand() * Math.PI * 2, d = rand() * 100, r = 6 + rand() * 26;
    g.fillStyle = `rgba(120,118,112,${.12 + rand() * .2})`;
    g.beginPath(); g.arc(128 + Math.cos(a) * d, 128 + Math.sin(a) * d, r, 0, Math.PI * 2); g.fill();
  }
  return c;
}
const dotTex = makeDot(), cloudTex = makeCloud();

/* ===================== cielo ===================== */
const skyU = {
  uTop: { value: col(0) }, uHor: { value: col(0) }, uBot: { value: col(0) },
  uSunDir: { value: V3(0, 1, 0) }, uSunCol: { value: col(0) }, uSunVis: { value: 1 }
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform vec3 uTop, uHor, uBot, uSunCol, uSunDir; uniform float uSunVis; varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir); float h = d.y;
      vec3 c = h >= 0.0 ? mix(uHor, uTop, pow(clamp(h,0.0,1.0), 0.48)) : mix(uHor, uBot, smoothstep(0.0, 0.18, -h));
      float s = max(dot(d, normalize(uSunDir)), 0.0);
      c += uSunCol * (pow(s, 5.0) * 0.22 + pow(s, 42.0) * 0.55) * uSunVis;
      c += uSunCol * smoothstep(0.99955, 0.9998, s) * 7.0 * uSunVis;
      gl_FragColor = vec4(c, 1.0);
      #include <tonemapping_fragment>
      #include <encodings_fragment>
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 48, 24), skyMat);
sky.renderOrder = -10; sky.frustumCulled = false; scene.add(sky);

// scena "specchio" per la mappa d'ambiente (riflessi su ottone, vetro, laccatura)
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), skyMat));
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null, envTimer = 0;
function refreshEnv(){
  const rt = pmrem.fromScene(envScene, 0.04);
  scene.environment = rt.texture;
  if (envRT) envRT.dispose();
  envRT = rt;
}

// stelle
const starGeo = new THREE.BufferGeometry();
{
  const n = 1800, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++){
    const u = rand(), v = .03 + rand() * .97, th = u * Math.PI * 2, y = v, r = Math.sqrt(1 - y * y);
    p[i * 3] = Math.cos(th) * r * 800; p[i * 3 + 1] = y * 800; p[i * 3 + 2] = Math.sin(th) * r * 800;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(p, 3));
}
const starMat = new THREE.PointsMaterial({ size: 2.2 * Math.min(devicePixelRatio, 2), sizeAttenuation: false, map: dotTex, transparent: true, depthWrite: false, fog: false, opacity: 0 });
const stars = new THREE.Points(starGeo, starMat); stars.renderOrder = -9; stars.frustumCulled = false; scene.add(stars);

// luna con la fase reale
const moonBase = makeMoon();
const moonCanvas = document.createElement('canvas'); moonCanvas.width = moonCanvas.height = 256;
const moonTex = canvasTex(moonCanvas);
const moon = new THREE.Sprite(new THREE.SpriteMaterial({ map: moonTex, fog: false, transparent: true, depthWrite: false }));
moon.scale.set(34, 34, 1); moon.renderOrder = -8; scene.add(moon);
let moonIllum = 1, moonPhaseName = '', moonStamp = -1e15;
const PHASE_NAMES = ['luna nuova', 'luna crescente', 'primo quarto', 'gibbosa crescente', 'luna piena', 'gibbosa calante', 'ultimo quarto', 'luna calante'];
function moonPhaseAt(date){
  const syn = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14);
  let p = ((date.getTime() - ref) / 86400000 / syn) % 1; if (p < 0) p += 1; return p;
}
function drawMoonPhase(p, southern){
  const g = moonCanvas.getContext('2d'), R = 126, cx = 128, cy = 128;
  g.clearRect(0, 0, 256, 256);
  g.globalAlpha = .09; g.drawImage(moonBase, 0, 0); g.globalAlpha = 1;     // luce cinerea sulla parte in ombra
  const k = Math.cos(p * Math.PI * 2); let flip = p < .5 ? 1 : -1; if (southern) flip = -flip;
  const m = document.createElement('canvas'); m.width = m.height = 256; const mg = m.getContext('2d');
  mg.fillStyle = '#fff'; mg.beginPath();
  for (let i = 0; i <= 48; i++){ const t = -Math.PI / 2 + i / 48 * Math.PI; mg.lineTo(cx + flip * R * Math.cos(t), cy + R * Math.sin(t)); }
  for (let i = 0; i <= 48; i++){ const t = Math.PI / 2 - i / 48 * Math.PI; mg.lineTo(cx + flip * k * R * Math.cos(t), cy + R * Math.sin(t)); }
  mg.closePath(); mg.fill();
  const l = document.createElement('canvas'); l.width = l.height = 256; const lg = l.getContext('2d');
  lg.drawImage(moonBase, 0, 0); lg.globalCompositeOperation = 'destination-in'; lg.filter = 'blur(2.5px)'; lg.drawImage(m, 0, 0);
  g.drawImage(l, 0, 0); moonTex.needsUpdate = true;
  moonIllum = (1 - k) / 2; moonPhaseName = PHASE_NAMES[Math.floor(p * 8 + .5) % 8];
}
const moonGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: dotTex, color: 0xb9c8ff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
moonGlow.scale.set(150, 150, 1); moonGlow.renderOrder = -8; scene.add(moonGlow);

/* ===================== luci ===================== */
const hemi = new THREE.HemisphereLight(0xbcd4ff, 0x2c2a20, 0.4); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 2); key.castShadow = true;
key.shadow.mapSize.set(LOW ? 1024 : 2048, LOW ? 1024 : 2048);
Object.assign(key.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11, near: 1, far: 90 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.025;
key.target.position.set(0, 1, 0); scene.add(key, key.target);

/* ===================== terreno ===================== */
const snowU = { value: 0 };
function addSnow(mat, amount){
  const prev = mat.onBeforeCompile;
  mat.onBeforeCompile = (sh, r) => {
    if (prev) prev(sh, r);
    sh.uniforms.uSnow = snowU;
    sh.fragmentShader = 'uniform float uSnow;\n' + sh.fragmentShader.replace('#include <color_fragment>',
      `#include <color_fragment>\n diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.86,0.89,0.94), uSnow * ${amount.toFixed(2)});`);
  };
  return mat;
}
function heightAt(x, z){
  const d = Math.hypot(x, z), k = smooth(7, 30, d);
  return (fbm(x * .035 + 3, z * .035 + 7) - .42) * 7 * k + Math.max(0, d - 70) * .12 * k;
}
const groundGeo = new THREE.PlaneGeometry(320, 320, LOW ? 90 : 170, LOW ? 90 : 170);
groundGeo.rotateX(-Math.PI / 2);
{
  const p = groundGeo.attributes.position, c = new Float32Array(p.count * 3);
  const g1 = col('#3d5a26'), g2 = col('#6b7a32'), g3 = col('#2d4520'), tmp = col(0);
  for (let i = 0; i < p.count; i++){
    const x = p.getX(i), z = p.getZ(i); p.setY(i, heightAt(x, z));
    const n = fbm(x * .08, z * .08), n2 = vnoise(x * .4, z * .4);
    tmp.copy(g1).lerp(g2, smooth(.35, .75, n)).lerp(g3, n2 * .35);
    c[i * 3] = tmp.r; c[i * 3 + 1] = tmp.g; c[i * 3 + 2] = tmp.b;
  }
  groundGeo.setAttribute('color', new THREE.BufferAttribute(c, 3));
  groundGeo.computeVertexNormals();
}
const groundMat = addSnow(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .95 }), 1);
const ground = new THREE.Mesh(groundGeo, groundMat); ground.receiveShadow = true; scene.add(ground);

const plazaMat = addSnow(new THREE.MeshStandardMaterial({ map: makeStone(), roughness: .85 }), .85);
const plaza = new THREE.Mesh(new THREE.CylinderGeometry(3.3, 3.45, .12, 72), plazaMat);
plaza.position.y = .06; plaza.receiveShadow = true; scene.add(plaza);

// montagne lontane
{
  const mMat = addSnow(new THREE.MeshStandardMaterial({ color: 0x55667a, roughness: 1, flatShading: true }), .7);
  for (let i = 0; i < 30; i++){
    const a = -Math.PI * .95 + rand() * Math.PI * .9, d = 270 + rand() * 170;
    const m = new THREE.Mesh(new THREE.ConeGeometry(60 + rand() * 90, 40 + rand() * 80, 5 + (rand() * 3 | 0)), mMat);
    m.position.set(Math.cos(a) * d, 8, Math.sin(a) * d); m.rotation.y = rand() * 6; scene.add(m);
  }
}

/* ===================== alberi ===================== */
const trees = [], LEAF_MATS = [];
const blossomMat = new THREE.PointsMaterial({ size: .38, map: dotTex, color: 0xff9fc4, transparent: true, depthWrite: false, opacity: 0 });
{
  const branchGeo = new THREE.CylinderGeometry(.025, .05, 1, 5); branchGeo.translate(0, .5, 0);
  const trunkGeo = new THREE.CylinderGeometry(.11, .19, 1, 7); trunkGeo.translate(0, .5, 0);
  const coneGeo = new THREE.ConeGeometry(1, 1.7, 9);
  const blobGeo = new THREE.IcosahedronGeometry(1, 1);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3324, roughness: .95 });

function solveIK(sh, target, L1, L2, pole, outElbow, outWrist){
  const d = tmpB.subVectors(target, sh); const dist = clamp(d.length(), .02, L1 + L2 - .002);
  const dir = d.normalize();
  const a = (L1 * L1 - L2 * L2 + dist * dist) / (2 * dist), h = Math.sqrt(Math.max(L1 * L1 - a * a, 0));
  const pd = tmpC.copy(pole).addScaledVector(dir, -pole.dot(dir)).normalize();
  outElbow.copy(sh).addScaledVector(dir, a).addScaledVector(pd, h);
  outWrist.copy(sh).addScaledVector(dir, dist);
}

    pts.push({ x: sa * r + ca * wob, y: ca * r - sa * wob, w: width * (.92 + .12 * Math.sin(t * 9 + ph)) * taper });

function renderFace(){
  fctx.clearRect(0, 0, 1024, 1024);

/* ===================== vetro bagnato ===================== */
const drops = []; let cond = 0, condT = 0, glassAcc = 0, maskAcc = 0, spawnAcc = 0, glassClean = true;
const GX = x => GL / 2 + x / FACE_R * GL / 2, GY = y => GL / 2 - y / FACE_R * GL / 2;
function updateGlass(dt){
  // nuove gocce
  spawnAcc += (W.rain * 45 + W.storm * 25) * dt;
  while (spawnAcc >= 1){
    spawnAcc--;
    if (drops.length < 260) drops.push({ x: Math.random() * GL, y: Math.random() * GL * .95, r: 1.2 + Math.pow(Math.random(), 2) * 5, vy: 0, wob: Math.random() * 10 });
  }
  const slide = windDir.x * W.wind * 1.5;
  for (let i = drops.length - 1; i >= 0; i--){
    const d = drops[i];
    if (d.r > 4.3){
      d.vy = damp(d.vy, 35 + d.r * 14, 3, dt);
      d.y += d.vy * dt * (.6 + .4 * Math.sin(simT * 3 + d.wob));
      d.x += (Math.sin(simT * 2 + d.wob) * 6 + slide) * dt;
      if (Math.random() < dt * 5 && d.r > 3.5){ drops.push({ x: d.x, y: d.y - d.r, r: d.r * .3, vy: 0, wob: 0 }); d.r -= .05; }
      mctx.globalCompositeOperation = 'source-over'; mctx.fillStyle = '#000';
      mctx.beginPath(); mctx.arc(d.x, d.y, d.r * 1.2, 0, Math.PI * 2); mctx.fill();
      for (let j = 0; j < drops.length; j++){
        const o = drops[j]; if (o === d || o.r > d.r) continue;
        const dx = o.x - d.x, dy = o.y - d.y;
        if (dx * dx + dy * dy < (d.r + o.r) * (d.r + o.r) * .5){ d.r = Math.min(9, Math.sqrt(d.r * d.r + o.r * o.r)); o.r = 0; }
      }
    } else if (W.rain < .05){ d.r -= dt * .25; }
    else if (Math.random() < dt * .3){ d.r += .4; }
    if (d.r <= .3 || d.y > GL + 10){ drops.splice(i, 1); }
  }
  for (let i = drops.length - 1; i >= 0; i--) if (drops[i].r <= 0) drops.splice(i, 1);

  // condensa: fredda e umida, o nebbia
  condT = clamp(smooth(70, 96, humidity) * smooth(15, 3, tempC) + W.fog * .35 + W.snow * .15, 0, .8);
  cond = damp(cond, condT, .15, dt);
  if (rig.mode === 'cloth' || (rig.mode === 'pen' && rig.penK > 20)){
    const c = rig.mode === 'cloth' ? rig.cloth : rig.penTip, r = rig.mode === 'cloth' ? 30 : 9;
    mctx.globalCompositeOperation = 'source-over'; mctx.fillStyle = '#000';
    mctx.beginPath(); mctx.arc(GX(c.x), GY(c.y - FACE_Y), r, 0, Math.PI * 2); mctx.fill();
  }
  maskAcc += dt;
  if (maskAcc > .5){ maskAcc = 0; mctx.globalCompositeOperation = 'destination-out'; mctx.fillStyle = 'rgba(0,0,0,.025)'; mctx.fillRect(0, 0, GL, GL); }

  glassAcc += dt; if (glassAcc < 1 / 30) return; glassAcc = 0;
  if (!drops.length && cond < .005){ if (!glassClean){ gctx.clearRect(0, 0, GL, GL); glassTex.needsUpdate = true; glassClean = true; } return; }
  glassClean = false;
  gctx.globalCompositeOperation = 'source-over'; gctx.clearRect(0, 0, GL, GL);
  if (cond > .005){
    gctx.fillStyle = `rgba(222,228,234,${(cond * .7).toFixed(3)})`; gctx.fillRect(0, 0, GL, GL);
    gctx.globalCompositeOperation = 'destination-out'; gctx.drawImage(fogMask, 0, 0); gctx.globalCompositeOperation = 'source-over';
  }
  for (const d of drops){
    gctx.fillStyle = 'rgba(30,36,44,.2)'; gctx.beginPath(); gctx.ellipse(d.x, d.y, d.r, d.r * 1.12, 0, 0, Math.PI * 2); gctx.fill();
    gctx.fillStyle = 'rgba(255,255,255,.5)'; gctx.beginPath(); gctx.arc(d.x + d.r * .3, d.y + d.r * .35, d.r * .45, 0, Math.PI * 2); gctx.fill();
    gctx.fillStyle = 'rgba(255,255,255,.85)'; gctx.beginPath(); gctx.arc(d.x - d.r * .35, d.y - d.r * .4, Math.max(.6, d.r * .22), 0, Math.PI * 2); gctx.fill();
  }
  glassTex.needsUpdate = true;
}

/* ===================== l'omino: compiti (cancella / disegna / attende) ===================== */
const REST_PEN = V3(.11, 1.58, .12), REST_CLOTH = V3(-.14, 1.53, .05);
const rig = {
  mode: 'idle', penTip: REST_PEN.clone(), penDesired: V3(), cloth: REST_CLOTH.clone(), clothDesired: V3(),
  penK: 9, clothK: 9, look: V3(0, FACE_Y, .3),
  lookOverride: null, cupHeld: false, clothOnShelf: false, cupTilt: 0, yawn: 0, yawnT: 0, cupTiltT: 0, steam: 0
};
const state = { minute: null, hour: null, dispMin: -1, dispHour: -1, breakAt: -1 };
const nowTotal = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const tasks = []; let cur = null;

function taskDraw(kind, getTotal){
  return {
    t: 0,
    start(){
      const tm = getTotal(), ang = kind === 'minute' ? (tm % 60) * 6 : hourQuant(tm);
      this.s = makeStroke(kind, ang); strokes.push(this.s);
      if (kind === 'minute'){ state.minute = this.s; state.dispMin = tm; } else { state.hour = this.s; state.dispHour = ang; }
      this.travel = .6; this.dur = kind === 'hour' ? 1.7 : 2.1;
    },
    update(dt){
      this.t += dt; const s = this.s; rig.mode = 'pen';
      if (this.t < this.travel){ const p = s.pts[0]; rig.penDesired.set(p.x, FACE_Y + p.y, GLASS_TIP - .045); rig.penK = 10; return false; }
      const u = clamp((this.t - this.travel) / this.dur, 0, 1), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      const p = strokePt(s, e * (s.pts.length - 1));
      rig.penDesired.set(p.x, FACE_Y + p.y, GLASS_TIP); rig.penK = 30;
      if (s.drawn !== e){ s.drawn = e; faceDirty = true; }
      if (u >= 1){ rig.penDesired.z = GLASS_TIP - .05; rig.penK = 8; return this.t > this.travel + this.dur + .35; }
      return false;
    }
  };
}
function taskErase(kind){
  return {
    t: 0,
    start(){
      this.s = state[kind]; this.travel = .55; this.dur = kind === 'minute' ? 2.8 : 2.3; this.swipes = kind === 'minute' ? 6 : 5;
      if (this.s) state[kind] = null;
    },
    update(dt){
      const s = this.s; if (!s) return true;
      this.t += dt; rig.mode = 'cloth';
      const a = s.angle * Math.PI / 180, sa = Math.sin(a), ca = Math.cos(a), L = s.len + .025;
      if (this.t < this.travel){ rig.clothDesired.set(sa * L, FACE_Y + ca * L, GLASS_TIP - .05); rig.clothK = 10; return false; }
      const u = clamp((this.t - this.travel) / this.dur, 0, 1), r = L - u * (L + .03), side = Math.sin(u * Math.PI * 2 * this.swipes) * .032;
      rig.clothDesired.set(sa * r + ca * side, FACE_Y + ca * r - sa * side, GLASS_TIP - .008); rig.clothK = 22;
      const tCut = clamp((r + .025 + .012) / (s.len + .012), 0, 1), er = 1 - tCut;
      if (er > s.erased){ s.erased = er; faceDirty = true; }
      if (u >= 1){
        if (s.erasedAt < 0){ s.erased = 1; s.erasedAt = simT; faceDirty = true; }
        rig.clothDesired.z = GLASS_TIP - .06; rig.clothK = 8;
        return this.t > this.travel + this.dur + .3;
      }
      return false;
    }
  };
}
function taskWaitMinute(target){
  return {
    start(){},
    update(){
      rig.mode = 'pen'; rig.penDesired.set(.025, FACE_Y - .015, GLASS_TIP - .05); rig.penK = 6;
      return ((nowTotal() - target + 1440) % 1440) < 720;
    }
  };
}
// pause dell'omino allo scoccare dell'ora
function taskCoffee(){
  const mouthP = V3(), tgt = V3();
  return {
    t: 0, start(){},
    update(dt){
      const t = this.t += dt; rig.mode = 'coffee'; rig.clothK = 5.5;
      worldOf(mouth, mouthP);
      if (t < 1.1){ tgt.copy(CLOTH_HOME); rig.lookOverride = CLOTH_HOME; }
      else if (t < 2.2){ rig.clothOnShelf = true; tgt.copy(CUP_HOME); rig.lookOverride = CUP_HOME; }
      else if (t < 3.4){ rig.cupHeld = true; tgt.copy(mouthP).add(tmpB.set(-.01, -.07, .1)); rig.lookOverride = null; }
      else if (t < 6.6){ tgt.copy(mouthP).add(tmpB.set(0, -.045, .085)); rig.cupTiltT = .65; rig.lookOverride = tmpC.copy(mouthP).add(tmpB.set(0, .3, .6)).clone(); }
      else if (t < 7.9){ rig.cupTiltT = 0; tgt.copy(CUP_HOME); rig.lookOverride = CUP_HOME; }
      else if (t < 9.0){ rig.cupHeld = false; tgt.copy(CLOTH_HOME); }
      else { rig.clothOnShelf = false; tgt.copy(REST_CLOTH); rig.mode = 'idle'; }
      rig.clothDesired.copy(tgt);
      rig.steam = rig.cupHeld ? 1 : 0;
      return t > 9.8;
    }
  };
}
function taskStretch(){
  return {
    t: 0, start(){},
    update(dt){
      const t = this.t += dt; rig.mode = 'stretch'; rig.penK = 4; rig.clothK = 4;
      if (t < 3.6){
        rig.penDesired.set(.16, 2.42, .0); rig.clothDesired.set(-.16, 2.45, .05);
        rig.lookOverride = V3(0, 3.6, 1.0);
        rig.yawnT = t > 1.2 && t < 3.2 ? 1 : 0;
      } else if (t < 5){
        rig.penDesired.set(.4, 2.02, .02); rig.clothDesired.set(-.4, 2.02, .06); rig.yawnT = 0;
      }
      return t > 6.4;
    }
  };
}
function pickBreak(){ return Math.random() < .5 ? taskCoffee() : taskStretch(); }
function schedule(){
  const d = new Date(), tm = d.getHours() * 60 + d.getMinutes(), sec = d.getSeconds() + d.getMilliseconds() / 1000;
  if (!state.minute && !state.hour && state.dispMin < 0){
    state.breakAt = tm;
    tasks.push(taskDraw('hour', nowTotal), taskDraw('minute', nowTotal)); return;
  }
  if (state.dispMin === tm && tm % 60 === 0 && state.breakAt !== tm && sec < 40){
    state.breakAt = tm; tasks.push(pickBreak()); return;
  }
  const next = (tm + 1) % 1440, needHour = hourQuant(next) !== state.dispHour, lead = needHour ? 12.5 : 6.5;
  if (state.dispMin === tm && sec >= 60 - lead){
    tasks.push(taskErase('minute'));
    if (needHour) tasks.push(taskErase('hour'), taskDraw('hour', () => next));
    tasks.push(taskWaitMinute(next), taskDraw('minute', nowTotal));
  } else if (state.dispMin !== tm){
    // fuori sincrono (pagina appena aperta, schermo in pausa...): ridisegna subito
    tasks.push(taskErase('minute'));
    if (hourQuant(tm) !== state.dispHour) tasks.push(taskErase('hour'), taskDraw('hour', nowTotal));
    tasks.push(taskDraw('minute', nowTotal));
  }
}
function runTasks(dt){
  rig.mode = 'idle'; rig.penDesired.copy(REST_PEN); rig.clothDesired.copy(REST_CLOTH); rig.penK = 6; rig.clothK = 6;
  rig.lookOverride = null; rig.cupTiltT = 0; rig.yawnT = 0;
  if (!cur){ if (!tasks.length) schedule(); if (tasks.length){ cur = tasks.shift(); cur.start(); } }
  if (cur && cur.update(dt)) cur = null;
}

let blinkT = 2, lookCamT = 6, lookingCam = false;
const qTmp = new THREE.Quaternion(), poleR = V3(.7, -1, -.45), poleL = V3(-.7, -1, -.45), penDir = V3(), shTmp = V3();
function updateRig(dt){
  const breath = Math.sin(simT * 1.6) * .004;
  rig.penTip.x = damp(rig.penTip.x, rig.penDesired.x, rig.penK, dt);
  rig.penTip.y = damp(rig.penTip.y, rig.penDesired.y, rig.penK, dt);
  rig.penTip.z = damp(rig.penTip.z, rig.penDesired.z, rig.penK, dt);
  rig.cloth.x = damp(rig.cloth.x, rig.clothDesired.x, rig.clothK, dt);
  rig.cloth.y = damp(rig.cloth.y, rig.clothDesired.y, rig.clothK, dt);
  rig.cloth.z = damp(rig.cloth.z, rig.clothDesired.z, rig.clothK, dt);

  const act = rig.mode === 'pen' ? rig.penTip : rig.mode === 'cloth' ? rig.cloth : null;
  const tx = act ? clamp(act.x * .5, -.17, .17) : 0;
  const stretching = rig.mode === 'stretch';
  const ty = 1.27 + (act ? clamp((act.y - FACE_Y) * .42, -.12, .11) : 0) + breath + (stretching ? .06 : 0);
  torso.position.x = damp(torso.position.x, tx, 3.5, dt);
  torso.position.y = damp(torso.position.y, ty, 3.5, dt);
  torso.position.z = damp(torso.position.z, act ? -.045 : -.07, 3, dt);
  torso.rotation.z = -torso.position.x * .5;
  torso.rotation.x = damp(torso.rotation.x, act ? .06 + Math.max(0, 1.27 - torso.position.y) * .9 : stretching ? -.13 : .02, 3, dt);
  torso.updateMatrixWorld(true);

  // braccio destro + pennarello
  worldOf(shoulderR, shTmp);
  penDir.subVectors(rig.penTip, shTmp).normalize().multiplyScalar(.6).add(tmpA.set(0, 0, 1)).normalize();
  const wristTarget = tmpC.copy(rig.penTip).addScaledVector(penDir, -.13).clone();
  solveIK(shTmp, wristTarget, L1, L2, poleR, armR.elbowP, armR.wristP);
  applyArm(armR, shTmp);
  placeLimb(pen, armR.wristP, tmpB.copy(armR.wristP).addScaledVector(penDir, .135));
  penCap.position.copy(armR.wristP).addScaledVector(penDir, -.01); penCap.quaternion.copy(pen.quaternion);

  // braccio sinistro + panno
  worldOf(shoulderL, shTmp);
  const wl = V3(rig.cloth.x - .01, rig.cloth.y - .015, rig.cloth.z - .055);
  solveIK(shTmp, wl, L1, L2, poleL, armL.elbowP, armL.wristP);
  applyArm(armL, shTmp);
  if (rig.clothOnShelf){ cloth.position.copy(CLOTH_HOME).add(tmpB.set(0, .005, 0)); cloth.rotation.set(Math.PI / 2, 0, .4); }
  else {
    cloth.position.set(armL.wristP.x + .01, armL.wristP.y + .015, armL.wristP.z + .05); cloth.rotation.set(0, 0, Math.sin(simT * 7) * (rig.mode === 'cloth' ? .25 : .05));
    if (Math.hypot(cloth.position.x, cloth.position.y - FACE_Y) > FACE_R - .055) cloth.position.z = Math.min(cloth.position.z, .25); // non attraversa la cornice
  }
  rig.cupTilt = damp(rig.cupTilt, rig.cupTiltT, 3, dt);
  if (rig.cupHeld){ cup.position.copy(rig.cloth); cup.rotation.set(-rig.cupTilt, 0, 0); }
  else { cup.position.copy(CUP_HOME); cup.rotation.set(0, 0, 0); }
  steam.forEach((s, i) => {
    const ph = (simT * .45 + i / steam.length) % 1;
    s.position.set(cup.position.x + Math.sin(simT * 2 + i * 1.7) * .012 * ph, cup.position.y + .04 + ph * .14, cup.position.z);
    s.material.opacity = .22 * Math.sin(ph * Math.PI) * rig.steam * (1 - rig.cupTilt);

  mouth.scale.set(1 + rig.yawn * .4, 1 + rig.yawn * 7, 1);

  // sguardo
  lookCamT -= dt;
  if (lookCamT <= 0){ lookingCam = !lookingCam; lookCamT = lookingCam ? 2.5 + Math.random() * 2 : 7 + Math.random() * 8; }
  const look = tmpA;
  if (rig.lookOverride) look.copy(rig.lookOverride);
  else if (act) look.copy(act);
  else if (lookingCam) look.copy(clock.worldToLocal(camera.position.clone()));
  else look.set(0, FACE_Y + .05, .3);
  rig.look.lerp(look, 1 - Math.exp(-dt * 5));
  const q0 = qTmp.copy(head.quaternion);
  head.lookAt(clock.localToWorld(rig.look.clone()));
  const qT = head.quaternion.clone(); head.quaternion.copy(q0).slerp(qT, 1 - Math.exp(-dt * 6));

  blinkT -= dt; if (blinkT <= 0) blinkT = 2.5 + Math.random() * 4;
  const bl = blinkT < .12 ? .12 : 1; for (const e of eyes) e.scale.y = bl;
}
function applyArm(a, sh){
  placeLimb(a.upper, sh, a.elbowP);
  placeLimb(a.fore, a.elbowP, a.wristP);
  a.elbow.position.copy(a.elbowP);
  a.cuff.position.copy(a.elbowP).lerp(a.wristP, .12);
  a.cuff.quaternion.copy(a.fore.quaternion).multiply(qTmp.setFromAxisAngle(tmpA.set(1, 0, 0), Math.PI / 2));
  a.hand.position.copy(a.wristP);
  a.hand.quaternion.copy(a.fore.quaternion);
}

function sunPosition(date, lat, lon){
  const rad = Math.PI / 180, d = date.getTime() / 86400000 - 10957.5;
  const g = (357.529 + .98560028 * d) * rad, q = 280.459 + .98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + .02 * Math.sin(2 * g)) * rad, e = (23.439 - .00000036 * d) * rad;
  const RA = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)), dec = Math.asin(Math.sin(e) * Math.sin(L));
  const GMST = ((18.697374558 + 24.06570982441908 * d) % 24 + 24) % 24;
  const H = (GMST * 15 + lon) * rad - RA, la = lat * rad;
  const el = Math.asin(Math.sin(la) * Math.sin(dec) + Math.cos(la) * Math.cos(dec) * Math.cos(H));
  const az = Math.atan2(-Math.sin(H), Math.tan(dec) * Math.cos(la) - Math.sin(la) * Math.cos(H));
  return { el, az };
}
const SKY_KEYS = [

  [2, '#3b62a3', '#f0a15e'], [9, '#3e7bcd', '#bcd2e6'], [40, '#2a66cc', '#a6c8ea']
].map(k => ({ e: k[0], top: col(k[1]), hor: col(k[2]) }));
const sc = { top: col(0), hor: col(0) };
function skyAt(elev){
  if (elev <= SKY_KEYS[0].e){ sc.top.copy(SKY_KEYS[0].top); sc.hor.copy(SKY_KEYS[0].hor); return; }
  const last = SKY_KEYS[SKY_KEYS.length - 1];
  if (elev >= last.e){ sc.top.copy(last.top); sc.hor.copy(last.hor); return; }
  let i = 0; while (elev > SKY_KEYS[i + 1].e) i++;
  const a = SKY_KEYS[i], b = SKY_KEYS[i + 1], t = smooth(a.e, b.e, elev);
  sc.top.copy(a.top).lerp(b.top, t); sc.hor.copy(a.hor).lerp(b.hor, t);
}

const AUD = { ctx: null, on: false, lastSec: -1, lastChime: -1 };

  const ctx = AUD.ctx = new AC();

  const sr = ctx.sampleRate, nb = ctx.createBuffer(1, sr * 2, sr), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  for (let i = 0; i < bd.length; i++){ lastB = (lastB + .02 * (Math.random() * 2 - 1)) / 1.02; bd[i] = lastB * 3.5; }
  AUD.noise = nb; AUD.brown = bb;
  const loop = (filters, g) => {
    const src = ctx.createBufferSource(); src.buffer = nb; src.loop = true;
    let node = src; for (const f of filters){ node.connect(f); node = f; }
    node.connect(g); g.connect(AUD.master); src.start();
  };

  AUD.rainG = ctx.createGain(); AUD.rainG.gain.value = 0; loop([filt('highpass', 500), filt('lowpass', 7000)], AUD.rainG);
  AUD.windF = filt('bandpass', 350, .9); AUD.windG = ctx.createGain(); AUD.windG.gain.value = 0; loop([AUD.windF], AUD.windG);
  AUD.scratchG = ctx.createGain(); AUD.scratchG.gain.value = 0; loop([filt('bandpass', 2700, 1.6)], AUD.scratchG);
  AUD.wipeG = ctx.createGain(); AUD.wipeG.gain.value = 0; loop([filt('bandpass', 900, .8)], AUD.wipeG);

function tick(tock){

  const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = tock ? 1700 : 2300; f.Q.value = 6;
  const g = ctx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.4, t + .002); g.gain.exponentialRampToValueAtTime(.0001, t + .05);

  const o = ctx.createOscillator(); o.frequency.value = tock ? 420 : 520;
  const og = ctx.createGain(); og.gain.setValueAtTime(.05, t); og.gain.exponentialRampToValueAtTime(.0001, t + .09);
  o.connect(og); og.connect(AUD.master); o.start(t); o.stop(t + .1);

  const g = ctx.createGain(); g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(1.3 * power, t + .07); g.gain.exponentialRampToValueAtTime(.55 * power, t + .7);
  g.gain.exponentialRampToValueAtTime(.0001, t + 5.5);
  src.connect(lp); lp.connect(g); g.connect(AUD.master); src.start(t); src.stop(t + 6);
}
function chime(n){
  const ctx = AUD.ctx, t0 = ctx.currentTime + .1;
  for (let i = 0; i < n; i++){
    const t = t0 + i * 2.1;
    for (const [m, a, dcy] of [[1, .2, 3.6], [2, .1, 2.3], [2.76, .07, 1.6], [5.4, .035, .9]]){
      const o = ctx.createOscillator(); o.frequency.value = 196 * m;
      const g = ctx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(a, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dcy);
      o.connect(g); g.connect(AUD.master); o.start(t); o.stop(t + dcy + .1);
    }
  }
}
function updateAudio(){
  if (!AUD.on || AUD.ctx.state !== 'running') return;
  const t = AUD.ctx.currentTime;
  AUD.rainG.gain.setTargetAtTime(W.rain * .3 + W.storm * .08, t, .5);
  AUD.windG.gain.setTargetAtTime(clamp(W.wind / 14, 0, 1) * .22, t, .8);
  AUD.windF.frequency.setTargetAtTime(240 + W.wind * 25 + Math.sin(simT * .7) * 80, t, .3);
  const drawing = rig.mode === 'pen' && rig.penK > 20, wiping = rig.mode === 'cloth' && rig.clothK > 20;
  AUD.scratchG.gain.setTargetAtTime(drawing ? .045 : 0, t, .04);
  AUD.wipeG.gain.setTargetAtTime(wiping ? .07 * (.6 + .4 * Math.abs(Math.sin(simT * 14))) : 0, t, .03);
  const d = new Date(), sec = d.getSeconds();
  if (sec !== AUD.lastSec){ AUD.lastSec = sec; tick(sec % 2 === 1); }
  if (d.getMinutes() === 0 && sec < 3 && AUD.lastChime !== d.getHours()){ AUD.lastChime = d.getHours(); chime(d.getHours() % 12 || 12); }
}
const soundBtn = document.getElementById('sound');
function setSound(on){
  if (on && !AUD.ctx && !audioInit()) return;
  if (!AUD.ctx) return;
  AUD.on = on;
  if (on){ AUD.ctx.resume(); AUD.lastChime = new Date().getHours(); }
  AUD.master.gain.setTargetAtTime(on ? .8 : 0, AUD.ctx.currentTime, .25);
  soundBtn.setAttribute('aria-pressed', String(on));
  soundBtn.setAttribute('aria-label', on ? 'Disattiva i suoni' : 'Attiva i suoni');
  try { localStorage.setItem('tempo-reale-suoni', on ? '1' : '0'); } catch (e) {}
}
soundBtn.addEventListener('click', () => setSound(!AUD.on));
{
  let want = CONFIG.sound;
  try { if (localStorage.getItem('tempo-reale-suoni') === '1') want = true; } catch (e) {}
  if (want){
    setSound(true);   // in kiosk con --autoplay-policy=no-user-gesture-required parte subito
    addEventListener('pointerdown', () => { if (AUD.on && AUD.ctx.state !== 'running') AUD.ctx.resume(); }, { once: true });
  }
}

/* ===================== post-processing: bloom + profondità di campo ===================== */
let composer = null, bloomPass = null, bokehPass = null, fxOn = false, fxSlow = 0;
const FOCUS_P = V3(0, FACE_Y + .12, .3);
function setupFX(){
  if (LOW || !THREE.EffectComposer || !THREE.UnrealBloomPass || !THREE.BokehPass || !THREE.GammaCorrectionShader) return;
  try {
    const pr = renderer.getPixelRatio();
    const rt = new THREE.WebGLRenderTarget(innerWidth * pr, innerHeight * pr, { type: THREE.HalfFloatType });
    composer = new THREE.EffectComposer(renderer, rt);
    composer.setPixelRatio(pr); composer.setSize(innerWidth, innerHeight);
    composer.addPass(new THREE.RenderPass(scene, camera));
    bokehPass = new THREE.BokehPass(scene, camera, { focus: 5, aperture: .00018, maxblur: .0055, width: innerWidth, height: innerHeight });
    bokehPass.needsSwap = true;
    // nella mappa di profondità escludo sprite, punti e linee (pioggia e neve vicine diventano morbide)
    const noDepth = [stars, moon, moonGlow, lampHalo, rain, snowPts, fireflies, bolt, ...clouds, ...steam];
    const origRender = bokehPass.render.bind(bokehPass);
    bokehPass.render = (r, w, rd, dt, m) => {
      const vis = noDepth.map(o => o.visible); noDepth.forEach(o => { o.visible = false; });
      origRender(r, w, rd, dt, m);
      noDepth.forEach((o, i) => { o.visible = vis[i]; });
    };
    composer.addPass(bokehPass);
    bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .5, .55, .8);
    composer.addPass(bloomPass);
    composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));
    fxOn = CONFIG.fx;
  } catch (e) { console.warn('Post-processing non disponibile:', e); composer = null; fxOn = false; }
}

/* ===================== meteo reale (Open-Meteo, nessuna chiave) ===================== */
const $ = id => document.getElementById(id);
const hud = $('hud'); if (!CONFIG.showHud) hud.classList.add('hidden');
let demo = null;
function wmo(code){
  if (code === 0) return ['Sereno', { cloud: .05 }];
  if (code === 1) return ['Poco nuvoloso', { cloud: .3 }];
  if (code === 2) return ['Parzialmente nuvoloso', { cloud: .55 }];
  if (code === 3) return ['Coperto', { cloud: .95 }];
  if (code === 45 || code === 48) return ['Nebbia', { cloud: .7, fog: 1 }];
  if (code >= 51 && code <= 57) return ['Pioviggine', { cloud: .9, rain: .3, fog: .25 }];
  if (code >= 61 && code <= 67) return ['Pioggia', { cloud: .97, rain: code <= 61 ? .45 : code <= 63 ? .7 : 1 }];
  if (code >= 71 && code <= 77) return ['Neve', { cloud: .92, snow: code <= 71 ? .4 : code <= 73 ? .7 : 1 }];
  if (code >= 80 && code <= 82) return ['Rovesci', { cloud: .9, rain: .55 + .2 * (code - 80) }];
  if (code === 85 || code === 86) return ['Rovesci di neve', { cloud: .9, snow: code === 85 ? .5 : .9 }];
  if (code >= 95) return ['Temporale', { cloud: 1, rain: 1, storm: 1 }];
  return ['Variabile', { cloud: .5 }];
}
const DIRS = ['nord', 'nord-est', 'est', 'sud-est', 'sud', 'sud-ovest', 'ovest', 'nord-ovest'];
function setTarget(p, windMs, windFromDeg){
  Object.assign(WT, { cloud: 0, rain: 0, snow: 0, fog: 0, storm: 0 }, p);
  if (windMs != null) WT.wind = windMs;
  if (windFromDeg != null){ const a = (windFromDeg + 180) * Math.PI / 180; windDirT.set(Math.sin(a), -Math.cos(a)); }
}
let first = true;
async function fetchWeather(){
  if (demo) return;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}` +
      `&current=temperature_2m,relative_humidity_2m,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m&wind_speed_unit=ms&timezone=auto`;
    const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status);
    const c = (await r.json()).current;
    const [label, p] = wmo(c.weather_code);
    if (c.cloud_cover != null && c.weather_code !== 0) p.cloud = Math.max(p.cloud || 0, c.cloud_cover / 100);
    setTarget(p, c.wind_speed_10m, c.wind_direction_10m);
    tempC = c.temperature_2m; if (c.relative_humidity_2m != null) humidity = c.relative_humidity_2m;
    if (first){ Object.assign(W, WT); windDir.copy(windDirT); snowU.value = W.snow > .2 ? 1 : 0; wet = W.rain > .1 ? 1 : 0; first = false; envTimer = 0; }
    $('wTemp').textContent = Math.round(c.temperature_2m) + '°';
    $('wCond').textContent = label;
    const kmh = Math.round(c.wind_speed_10m * 3.6);
    const dir = DIRS[Math.round(((c.wind_direction_10m % 360) + 360) % 360 / 45) % 8];
    const tm = new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    $('wMeta').textContent = `Vento ${kmh} km/h da ${dir}, aggiornato alle ${tm}`;
  } catch (e) {
    $('wCond').textContent = 'Meteo non raggiungibile';
    $('wMeta').textContent = 'Riprovo tra un minuto. Controlla la connessione.';
    setTimeout(fetchWeather, 60000);
  }
}
function setDemo(name){
  demo = name;
  if (!name){ $('wMeta').textContent = ''; first = false; fetchWeather(); return; }
  const pr = PRESETS[name];
  setTarget({ cloud: pr.cloud, rain: pr.rain, snow: pr.snow, fog: pr.fog, storm: pr.storm }, pr.wind, 250);
  tempC = pr.temp; humidity = pr.hum; $('wTemp').textContent = pr.temp + '°';
  $('wCond').textContent = PRESET_LABEL[name] + ' (prova)';
  $('wMeta').textContent = 'Premi 0 per tornare al meteo reale';
}
if (CONFIG.forcedWeather && PRESETS[CONFIG.forcedWeather]){ setDemo(CONFIG.forcedWeather); Object.assign(W, WT); }
else fetchWeather();
setInterval(fetchWeather, CONFIG.weatherRefreshMin * 60000);
if (CONFIG.useGeolocation && navigator.geolocation){
  navigator.geolocation.getCurrentPosition(pos => {
    CONFIG.lat = pos.coords.latitude; CONFIG.lon = pos.coords.longitude; first = true; fetchWeather();
  }, () => {}, { timeout: 10000, maximumAge: 3600000 });
}

/* ===================== input ===================== */
const KEYMAP = { '1': 'sereno', '2': 'nuvoloso', '3': 'pioggia', '4': 'temporale', '5': 'neve', '6': 'nebbia' };
addEventListener('keydown', e => {
  if (KEYMAP[e.key]) setDemo(KEYMAP[e.key]);
  else if (e.key === '0') setDemo(null);
  else if (e.key === 'h' || e.key === 'H') toggleHud();
  else if (e.key === 's' || e.key === 'S') setSound(!AUD.on);
  else if (e.key === 'p' || e.key === 'P'){ if (composer){ fxOn = !fxOn; fxSlow = 0; } }
  else if (e.key === 't' || e.key === 'T'){ const i = SEASON_ORDER.indexOf(seasonOverride); seasonOverride = SEASON_ORDER[(i + 1) % SEASON_ORDER.length]; }
  else if (e.key === 'b' || e.key === 'B') tasks.push(pickBreak());
  else if (e.key === 'g' || e.key === 'G'){ daySpeed = daySpeed === 1 ? 720 : 1; if (daySpeed === 1) envOffset = 0; }
  else if (e.key === '?') $('help').classList.toggle('show');
});
function toggleHud(){ const h = hud.classList.toggle('hidden'); soundBtn.classList.toggle('hidden', h); }
if (!CONFIG.showHud) soundBtn.classList.add('hidden');
renderer.domElement.addEventListener('pointerup', toggleHud);
let mx = 0, my = 0;
addEventListener('pointermove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; });

function onResize(){
  const a = innerWidth / innerHeight;
  camera.aspect = a; camera.fov = a < 1 ? clamp(34 / a * .85, 34, 70) : 34;
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
  if (composer) composer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', onResize); onResize();

/* ===================== ciclo principale ===================== */
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = clamp((now - last) / 1000, 0, .1); last = now; simT += dt;

  const sway = REDUCED_MOTION ? 0 : 1;
  camera.position.set(
    CAM_BASE.x + (Math.sin(simT * .05) * .25 + mx * .35) * sway,
    CAM_BASE.y + (Math.sin(simT * .07) * .04 - my * .15) * sway + (flash > .8 ? (Math.random() - .5) * .01 : 0),
    CAM_BASE.z);
  camera.lookAt(CAM_LOOK);

  updateWeatherFX(dt, simT);
  updateEnvironment(dt);
  updateSeason(dt, simT);
  runTasks(dt);
  updateRig(dt);
  updateGlass(dt);
  updateAudio();
  if (faceDirty) renderFace();
  skyLine();

  if (fxOn && composer){
    bokehPass.uniforms.focus.value = camera.position.distanceTo(FOCUS_P);
    bloomPass.strength = .32 + .5 * night + flash * .8 + W.fog * .15;
    composer.render(dt);
    // se l'hardware non regge (sotto ~24 fps per 4 secondi), spengo gli effetti
    fxSlow = (now - frame.prev) > 42 ? fxSlow + dt : Math.max(0, fxSlow - dt * .5);
    if (fxSlow > 4){ fxOn = false; console.info('Effetti cinema disattivati: frame rate troppo basso (P per riattivarli)'); }
  } else renderer.render(scene, camera);
  frame.prev = now;
}
let skyText = '';
function skyLine(){
  const txt = `${SEASON.name}, ${moonPhaseName}`;
  if (txt !== skyText){ skyText = txt; document.getElementById('wSky').textContent = txt; }
}
setupFX(); onResize();
refreshEnv();
requestAnimationFrame(frame);
</script>
